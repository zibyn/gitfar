[package]
name = "gitfard"
edition.workspace = true
version.workspace = true

[dependencies]
arc-swap = "1"
axum = "0.8"
base64.workspace = true
clap = { version = "4", features = ["derive"] }
gitfar-proto.workspace = true
gix = { version = "0.90", default-features = false, features = ["max-performance", "revision", "sha1"] }
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
hex = "0.4"
jiff = { version = "0.2", features = ["serde"] }
prometheus-client = "0.25"
quick_cache = "0.7"
rand = "0.10"
rayon = "1.12"
rmcp = { version = "3.8", features = ["server", "transport-streamable-http-server"] }
rustix = { version = "1", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
http-body-util = "0.1"
rmcp = { version = "3.8", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
