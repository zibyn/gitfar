# Bare binaries (spec §6.2): a `v*` tag attaches linux x86_64 `gitfard` and `gitfar` to its GitHub release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p gitfard -p gitfar
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes target/release/gitfard target/release/gitfar
        env:
          GH_TOKEN: ${{ github.token }}
  # OCI image (spec §6.2): the repo Dockerfile, pushed to ghcr.io as gitfard:<tag>.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gitfard:${{ github.ref_name }}
