[workspace]
resolver = "2"
members = ["crates/gitfar-proto", "crates/gitfard", "crates/gitfar"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
gitfar-proto = { path = "crates/gitfar-proto" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
